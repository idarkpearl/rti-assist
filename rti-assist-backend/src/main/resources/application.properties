spring.application.name=rti-assist-backend
server.port=8000
server.error.include-message=always
server.error.include-binding-errors=always
spring.jackson.serialization.indent-output=true

# Multipart File Uploads (Phase 3 Documents)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# Database Persistence & Flyway Migrations
# Default: Zero-setup file-based persistent H2 database in PostgreSQL compatibility mode.
# To use PostgreSQL instead, activate profile "postgres" or set DB_URL=jdbc:postgresql://... in .env
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/rti_assist_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Embedded H2 Web Console (http://localhost:8000/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console
